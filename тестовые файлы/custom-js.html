<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Демо: самописная JS-презентация</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #0f172a; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 10%;
    color: #fff; opacity: 0; transform: translateX(60px); transition: opacity .5s, transform .5s; pointer-events: none; }
  .slide.active { opacity: 1; transform: none; pointer-events: auto; }
  h1 { font-size: 64px; margin: 0 0 16px; } h2 { font-size: 44px; margin: 0 0 24px; } p, li { font-size: 28px; }
  .s1 { background: linear-gradient(135deg, #4f46e5, #9333ea); }
  .s2 { background: #0f766e; } .s3 { background: #b45309; } .s4 { background: #1e293b; }
  .bar { display: flex; align-items: flex-end; gap: 24px; height: 260px; }
  .bar div { width: 80px; background: #fbbf24; border-radius: 6px 6px 0 0; transition: height 1s .3s; height: 0; }
  .active .bar div:nth-child(1) { height: 40%; } .active .bar div:nth-child(2) { height: 75%; } .active .bar div:nth-child(3) { height: 100%; }
  #counter { position: fixed; right: 24px; bottom: 16px; color: #fff8; font-size: 18px; }
</style>
</head>
<body>
<section class="slide s1 active"><h1>Квартальный отчёт</h1><p>Интерактивная презентация на чистом JavaScript</p></section>
<section class="slide s2"><h2>Итоги</h2><ul><li>Выручка +24%</li><li>Новых клиентов: 1 240</li><li>NPS: 71</li></ul></section>
<section class="slide s3"><h2>Рост по месяцам</h2><div class="bar"><div></div><div></div><div></div></div></section>
<section class="slide s4"><h2>Спасибо!</h2><p id="dyn"></p></section>
<div id="counter"></div>
<script>
  const slides = [...document.querySelectorAll('.slide')];
  let cur = 0;
  document.getElementById('dyn').textContent = 'Текст сгенерирован скриптом: ' + slides.length + ' слайда';
  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) => s.classList.toggle('active', k === cur));
    document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  }
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) show(cur + 1);
    if (['ArrowLeft', 'PageUp'].includes(e.key)) show(cur - 1);
  });
  show(0);
</script>
</body>
</html>
